<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="One Village Shipping &amp; Freight — courier, freight, and warehouse management.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="One Village Shipping &amp; Freight">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>One Village Shipping &amp; Freight</title>
  <link rel="manifest" href="manifest.json">

  <!--
    In-browser OCR for the warehouse package scanner (Ocr service in
    lib/services/ocr_service.dart calls into this via dart:js_interop).
    Runs entirely client-side — no image ever leaves the browser, no
    account/API key needed. Loaded synchronously (no async/defer) so the
    `Tesseract` global is guaranteed ready before any Dart interop call;
    the actual OCR engine (worker + wasm + trained data) is fetched lazily
    by Tesseract.js itself only when a scan actually runs recognition, not
    at page load.
  -->
  <script src="https://unpkg.com/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
